[package]
name = "{{project_name}}_accelerate"
version = "0.1.0"
edition = "2021"

[lib]
# setuptools-rust renames the built artifact to the ext-module target declared
# in pyproject.toml ({{project_name}}._accelerate); this is just the crate name.
name = "_accelerate"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies.pyo3]
version = "0.27"
features = ["extension-module", "abi3-py310"]

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
