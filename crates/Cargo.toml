[package]
name = "{{project_name}}_accelerate"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[lib]
# setuptools-rust renames the built artifact to the ext-module target declared
# in pyproject.toml ({{project_name}}._accelerate); this is just the crate name.
name = "_accelerate"
crate-type = ["cdylib"]
path = "src/lib.rs"
doctest = false

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py310"] }

[features]
extension-module = ["pyo3/extension-module"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[lints.clippy]
print_stdout = "deny"
print_stderr = "deny"
undocumented_unsafe_blocks = "deny"
unwrap_used = "deny"
wildcard_imports = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
redundant_pub_crate = "warn"
items_after_statements = "warn"
fn_params_excessive_bools = "warn"
float_cmp = "warn"
suspicious_operation_groupings = "deny"
unreadable_literal = "warn"
doc_markdown = "warn"
too_many_lines = "warn"
cast_precision_loss = "warn"
cast_possible_truncation = "warn"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
