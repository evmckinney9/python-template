name: 🚀 Feature Request
description: Suggest a new idea for {{project_name}}
title: "[Feature Request]: "
labels: ["enhancement"]
assignees:
  - {{github_username}}
body:
  - type: textarea
    id: feature-description
    attributes:
      label: Feature Description and Why
      placeholder: Describe the feature and its use.
    validations:
      required: true
  - type: textarea
    id: more-details
    attributes:
      label: Additional Details / Helpful Resources
      placeholder: Add examples or references.
    validations:
      required: false
