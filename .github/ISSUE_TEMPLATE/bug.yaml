name: 🐛 Bug Report
description: File a bug report for {{project_name}}
title: "[Bug]: "
labels: ["bug", "triage"]
assignees:
  - {{github_username}}
body:
  - type: textarea
    id: bug-description
    attributes:
      label: Bug Description
      placeholder: Describe the expected and actual behavior.
    validations:
      required: true
  - type: textarea
    id: minimal-reproducible-example
    attributes:
      label: Minimal Reproducible Example
      placeholder: |
        from {{project_name}} import ...
        ...
      render: python
    validations:
      required: true
