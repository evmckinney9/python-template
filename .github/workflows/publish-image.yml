name: Publish container image

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    # Dormant until image publishing is turned on: set the repository variable
    # PUBLISH_IMAGE=true (Settings -> Secrets and variables -> Actions).
    # Pushes the self-verifying `artifact` stage for one-command reviewer runs:
    #   docker run -it --rm ghcr.io/<owner>/<repo>:<tag>
    if: vars.PUBLISH_IMAGE == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push artifact image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          TAG="${{ github.event.release.tag_name }}"
          docker build --target artifact -f .devcontainer/Dockerfile \
            -t "$IMAGE:$TAG" -t "$IMAGE:latest" .
          docker push "$IMAGE:$TAG"
          docker push "$IMAGE:latest"
