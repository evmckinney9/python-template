name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  lint:
    needs: preflight
    # null == false is true in Actions expressions, so pushes (no PR payload) run too
    if: needs.preflight.outputs.ok == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - run: pip install pre-commit --quiet

      - run: pre-commit run --all-files

  test:
    needs: preflight
    if: needs.preflight.outputs.ok == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - run: rustup toolchain install  # version from rust-toolchain.toml

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install
        run: pip install -e '.[test]' --quiet

      - name: Check Rust
        run: |
          cargo fmt --manifest-path crates/Cargo.toml --check
          cargo clippy --manifest-path crates/Cargo.toml --all-targets --all-features -- -D warnings
          cargo test --manifest-path crates/Cargo.toml --locked --all-targets
          RUSTDOCFLAGS="-D warnings" cargo doc --manifest-path crates/Cargo.toml --no-deps

      - run: pytest tests/
