name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, ready_for_review]

jobs:
  preflight:
    uses: ./.github/workflows/preflight.yml

  lint:
    needs: preflight
    # null == false is true in Actions expressions, so pushes (no PR payload) run too
    if: needs.preflight.outputs.ok == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pre-commit
        run: pip install pre-commit ruff --quiet

      - name: Run pre-commit
        run: pre-commit run --all-files

  test:
    needs: preflight
    if: needs.preflight.outputs.ok == 'true' && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/pyproject.toml"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Install
        run: pip install -e '.[test]' --quiet

      - name: Run pytest
        run: pytest src/tests/
